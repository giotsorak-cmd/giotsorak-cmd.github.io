# Ενημερώνει τη διαθεσιμότητα των καταλυμάτων (assets/availability.json) από Airbnb και Booking.
# Χρειάζεται το secret ICAL_FEEDS (Settings → Secrets and variables → Actions).
name: Διαθεσιμότητα καταλυμάτων

on:
  schedule:
    - cron: '23 */2 * * *'   # κάθε 2 ώρες
  workflow_dispatch:          # και με το χέρι: Actions → «Διαθεσιμότητα καταλυμάτων» → Run workflow

permissions:
  contents: write

concurrency:
  group: availability
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ανάγνωση ημερολογίων
        env:
          ICAL_FEEDS: ${{ secrets.ICAL_FEEDS }}
        run: node _tools/sync-availability.js
      - name: Αποθήκευση αν άλλαξε κάτι
        run: |
          if [ -n "$(git status --porcelain assets/availability.json)" ]; then
            git config user.name "comfystay-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/availability.json
            git commit -m "Ενημέρωση διαθεσιμότητας"
            git pull --rebase
            git push
          else
            echo "Καμία αλλαγή"
          fi
