name: Εισαγωγή φωτογραφιών
# Κατεβάζει φωτογραφίες από τη λίστα photo-import/<φάκελος>.txt (μία διεύθυνση ανά γραμμή)
# στο img/<φάκελος>/ ως 01.jpg, 01-s.jpg, ... και σβήνει τη λίστα.
on:
  push:
    paths: ['photo-import/*.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Λήψη
        run: |
          set -e
          for list in photo-import/*.txt; do
            [ -f "$list" ] || continue
            name=$(basename "$list" .txt)
            mkdir -p "img/$name"
            n=0
            # Κάθε γραμμή: «μεγάλη [μικρή]». Για Airbnb αρκεί μία διεύθυνση.
            while read -r big small; do
              big=$(echo "$big" | tr -d '\r'); small=$(echo "$small" | tr -d '\r')
              [ -z "$big" ] && continue
              n=$((n+1)); f=$(printf '%02d' $n)
              if [ -z "$small" ]; then base="${big%%\?*}"; big="$base?im_w=1440"; small="$base?im_w=720"; fi
              curl -fsSL -A 'Mozilla/5.0' -o "img/$name/$f.jpg" "$big"
              curl -fsSL -A 'Mozilla/5.0' -o "img/$name/$f-s.jpg" "$small"
            done < "$list"
            echo "$name: $n photos"
            git rm -q "$list"
          done
      - name: Αποθήκευση
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Εισαγωγή φωτογραφιών' || exit 0
          git push
